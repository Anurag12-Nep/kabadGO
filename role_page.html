
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KabadGo - Choose Your Role</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #EDF9E0;
            min-height: 100vh;
            padding: 40px 20px;
            color: #263C20;
        }

        .header {
            text-align: center;
            margin: 50px auto 0;
        }

        .header h1 {
            font-size: clamp(28px, 4vw, 46px);
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header h2 {
            font-size: 17px;
            font-weight: 400;
            color: #64705E;
        }

        .option {
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 28px;
            margin: 55px auto 0;
        }

        .seller,
        .buyer {
            background-color: #FFFFFF;
            padding: 35px 25px;
            border: 2px solid;
            border-radius: 16px;
            width: 300px;
            min-height: 180px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s ease,
                        box-shadow 0.2s ease;
        }

        .seller {
            border-color: #1271D6;
            color: #1271D6;
        }

        .buyer {
            border-color: #31B10E;
            color: #31B10E;
        }

        .seller:hover,
        .buyer:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .seller h3,
        .buyer h3 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .seller p,
        .buyer p {
            font-size: 14px;
            font-weight: 400;
            color: #64705E;
        }

        .footer {
            text-align: center;
            margin-top: 35px;
            font-size: 13px;
            color: #64705E;
        }

        /* Mobile responsive */
        @media (max-width: 650px) {
            body {
                padding: 30px 16px;
            }

            .header {
                margin-top: 35px;
            }

            .header h2 {
                font-size: 15px;
            }

            .option {
                flex-direction: column;
                align-items: center;
                gap: 20px;
                margin-top: 35px;
            }

            .seller,
            .buyer {
                width: 100%;
                max-width: 340px;
                min-height: 150px;
                padding: 30px 20px;
            }

            .footer {
                margin-top: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>How will you use KabadGo?</h1>
        <h2>Please choose your specific role</h2>
    </div>

    <div class="option">
        <div class="seller" role="button" tabindex="0"
             onclick="selectRole('seller')"
             onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectRole('seller')}">
            <h3>I want to Sell Scrap</h3>
            <p>I have scrap to sell</p>
        </div>

        <div class="buyer" role="button" tabindex="0"
             onclick="selectRole('buyer')"
             onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectRole('buyer')}">
            <h3>I want to Collect Scrap</h3>
            <p>I collect scrap from others</p>
        </div>
    </div>

    <p class="footer">You can change this later in Settings.</p>

    <script>
        function selectRole(role) {
            alert("You selected: " +
                (role === "seller" ? "Sell Scrap" : "Collect Scrap"));
        }
    </script>

</body>
</html>
